services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: fnx
      POSTGRES_USER: fnx
      POSTGRES_PASSWORD: ${FNX_DB_PASSWORD:-fnx-local}
    ports:
      - "127.0.0.1:${FNX_DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./api/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fnx -d fnx"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    profiles: ["api"]
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      LOCAL_DB: ${LOCAL_DB:-false}
      FNX_DB_LOCAL_HOST: db
      FNX_DB_PORT: 5432
      FNX_DB_PASSWORD: ${FNX_DB_PASSWORD:-fnx-local}
      PGHOST: ${PGHOST:-}
      PGPORT: ${PGPORT:-}
      PGDATABASE: ${PGDATABASE:-fnx}
      PGUSER: ${PGUSER:-fnx}
      PGPASSWORD: ${PGPASSWORD:-}
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  postgres_data:

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: fnx
      POSTGRES_USER: fnx
      POSTGRES_PASSWORD: ${FNX_DB_PASSWORD:-fnx-local}
    ports:
      - "127.0.0.1:${FNX_DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./api/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fnx -d fnx"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    profiles: ["api"]
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: fnx
      PGUSER: fnx
      PGPASSWORD: ${FNX_DB_PASSWORD:-fnx-local}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
